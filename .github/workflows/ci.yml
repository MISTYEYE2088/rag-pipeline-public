name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: CLI smoke test
        run: |
          python -m ragdoc query --chunks build/chunks_adaptive.jsonl \
            --query "operator precedence" --top 3 | head -20

      - name: Artifacts match the code
        if: matrix.python-version == '3.13'
        run: |
          python tools/build_demo_data.py
          # The build writes no timestamps: a diff here means the committed
          # artifacts no longer match what the code produces from the corpus.
          git diff --exit-code -- build docs/data
