name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pin the tokenizer build. The committed artifacts are byte-reproducible only
# against the exact cl100k_base implementation that produced them: a different
# tiktoken build can shift token boundaries, which changes chunk text and makes
# the "artifacts match the code" check fail for a reason unrelated to the code.
# If you bump this, rebuild the artifacts in the same commit.
env:
  TIKTOKEN_VERSION: "0.14.0"
  # Force the strict tiktoken path. The default 'auto' silently degrades to the
  # regex tokenizer when tiktoken cannot fetch its BPE file, which would make a
  # reproducibility check compare two different tokenizers and call it a code bug.
  RAGDOC_TOKENIZER: "cl100k_base"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      # v6 runs on the Node 24 runtime; v4/v5 still ship Node 20 actions.
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "tiktoken==${TIKTOKEN_VERSION}" -e ".[dev]"
          python -c "import tiktoken; print('tiktoken', tiktoken.__version__)"

      - name: Tests
        run: pytest -q

      - name: CLI smoke test
        run: |
          python -m ragdoc query --chunks build/chunks_adaptive.jsonl \
            --query "operator precedence" --top 3 | head -20

      - name: Artifacts match the code
        if: matrix.python-version == '3.13'
        run: |
          python tools/build_demo_data.py
          # The build writes no timestamps: a diff here means the committed
          # artifacts no longer match what the code produces from the corpus.
          if git diff --quiet -- build docs/data; then
            echo "artifacts are byte-reproducible from the corpus"
            exit 0
          fi
          # Surface the difference as annotations: they are readable without
          # authenticated log access, which is how this gets debugged.
          echo "::error::Rebuilding from the corpus changed the committed artifacts."
          python -c "import json,pathlib;print('::error::parameters '+json.dumps(json.loads(pathlib.Path('build/stats.json').read_text(encoding='utf-8'))['parameters'],sort_keys=True))" || true
          git diff --stat -- build docs/data | head -8 | sed 's/^/::error::/' || true
          git diff -U0 -- build docs/data | grep -E '^[+-][^+-]' | cut -c1-160 | head -10 | sed 's/^/::error::/' || true
          exit 1
