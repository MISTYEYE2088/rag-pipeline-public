[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragdoc"
version = "0.1.0"
description = "Adaptive-length chunking for documentation RAG, with a static browser demo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "August Zhang" }]
keywords = ["rag", "chunking", "retrieval", "documentation", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.optional-dependencies]
# Exact cl100k_base token counts. Without it the package falls back to a
# dependency-free regex tokenizer (see ragdoc.tokenizer).
tiktoken = ["tiktoken>=0.7"]

[project.urls]
Homepage = "https://github.com/MISTYEYE2088/rag-pipeline-public"

[project.scripts]
ragdoc = "ragdoc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ragdoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::SyntaxWarning"]
