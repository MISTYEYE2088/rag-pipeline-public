[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragdoc"
version = "0.1.0"
description = "Adaptive-length chunking for documentation RAG, with a static browser demo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "August Zhang" }]
keywords = ["rag", "chunking", "retrieval", "documentation", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Text Processing :: Indexing",
]
dependencies = ["tiktoken>=0.7"]

[project.optional-dependencies]
# `tiktoken` is a hard dependency because the published measurement table is
# cl100k_base. The regex fallback in ragdoc.tokenizer still exists for
# environments where tiktoken has no wheel, but it counts differently: with the
# fallback the same corpus measures 156,257 tokens (not 166,496) and adaptive
# cuts 1 of 26 fittable tables instead of 0 of 24. Keep it as a degraded path,
# not as the default.
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/MISTYEYE2088/rag-pipeline-public"

[project.scripts]
ragdoc = "ragdoc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ragdoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::SyntaxWarning"]
